
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>

        <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <h1>Products</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Length</th>
            <th>Width</th>
            <th>Height</th>
            <th>Weight</th>
        </tr>

        {% for product in products %}
        <tr>
            <td>{{ product.name }}</td>
            <td>{{ product.length }}</td>
            <td>{{ product.width }}</td>
            <td>{{ product.height }}</td>
            <td>{{ product.weight }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="{% url 'home' %}">Back to Home</a>
</body>
</html>
